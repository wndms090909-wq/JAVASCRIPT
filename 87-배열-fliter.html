<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        let numbers = [1, 2, 3, 4, 5, 6];
        // let 새로운 배열명 = 배열명.filter(배열의 데이터를 저장할 변수, 순서, 배열 => 조건문)
        let even = numbers.filter((num) => num % 2 == 0);
        document.write(even + "<br>");

        // 데이터 값이 4보다 큰 값만 추출하여 새로운 배열로 만들기
        let count = numbers.filter(num => num > 4);
        document.write(count + "<br>");

        let fruits = ["apple", "banana", "cherry", "peach", "strawberry"];
        //fruits안의 데이터 중 길이가 6이상인 것만 찾아서 새로운 배열 만들기
        let result = fruits.filter(f => f.length >= 6);
        document.write(result + "<br>");

        const users = [
            { name: "kim", age: 40, 성별: "남자" },
            { name: "lee", age: 10, 성별: "여자" },
            { name: "hong", age: 20, 성별: "남자" },
            { name: "흰둥이", age: 5, 성별: "남자" },
        ]
        // users 안의 데이터 중 나이가 30살 이하인 데이터를 추출하여 새로운 배열 만들기
        let young = users.filter(u => u.age <= 30);
        // api json 파일 만들 때
        // JSON,stringify : object를 문자열로 변환할 때 사용.
        document.write(JSON.stringify(young) + "<br>");
        console.log(young);

        //user에서 성별이 남자인 데이터를 추출, 새로운 배열 만들기
        let man = users.filter(m => m.성별 == "남자");
        console.log(man);

        man.forEach(m => {
            document.write(`${m.name} ${m.age} ${m.성별}<br>`)
        })
    </script>
</head>

<body>
    <h1>filter</h1>
    <p>배열의 데이터 중 조건에 맞는 요소를 추출하여 새로운 배열을 만드는 것.</p>
</body>

</html>
