<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        //비동기처리 콜백지옥 setTimeout
        //1초뒤에 안녕 실행
        //안녕이 출력된 후 1초뒤에 또 안녕
        //3초뒤에 반가워~
        setTimeout(() => {
            console.log("1. 안녕");
            setTimeout(() => {
                console.log("2. 또 안녕");
                setTimeout(() => {
                    console.log("3. 반가워~");
                }, 1000)
            }, 1000)
        }, 1000)
    </script>
</head>

<body>

</body>

</html>
