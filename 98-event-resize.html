<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        window.onload=function(){
            let widthShow = document.querySelector(".w");
            let heightShow = document.querySelector(".h");

            //실제 윈도우의 너비와 높이를 저장할 변수
            let wWidth;
            let wHeight;
            function siteInit(){
                wWidth = window.innerWidth;
                wHeight = window.innerHeight;
                widthShow.innerHTML = wWidth;
                heightShow.innerHTML = wHeight;
            }
            siteInit();

            window.addEventListener("resize", function(){
                siteInit();
            })
        }
    </script>
</head>
<body>
    <h1>resize event</h1>
    <div class="info">
        <p>width: <span class="w">0</span></p>
        <p>height: <span class="h">0</span></p>
    </div>
</body>
</html>
