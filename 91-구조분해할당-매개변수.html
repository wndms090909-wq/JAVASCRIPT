<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        //사칙연산 함수
        function myCaculator(op, ...num) {
            
            if (op == "add") {
                //result = 1+2+3+4=10
                let result = 0;
                for(n of num){
                    result += n;
                }
                document.write(`더하기: ${result}<br>`)
            }
            // else if (op == "minus") {

            // }
            else if (op == "mul") {
                let result = 1;
                for(n of num){
                    result *=n;
                }
                document.write(`곱하기: ${result}`)
            }
        }
        myCaculator("add", 1, 2, 3, 4);
        myCaculator("minus", 10, 5);
        myCaculator("mul", 2, 3, 5);
    </script>
</head>

</html>
