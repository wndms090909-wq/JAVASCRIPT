<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        // 과일의 종류를 저장할 배열만들기
        let fruits = ["사과", "배", "감", "포도"];
        //forEach fruits 배열의 데이터를 화면에 출력하기
        document.write(fruits, "<br>")
        //배열명.forEach((배열데이터를 저장할 변수, 순서변수, 임시배열변수)=>{
        //})
        fruits.forEach((item) => {
            document.write(item, "<br>");
        })

        //색상을 저장할 배열
        let colors = ["빨강", "주황", "노랑", "초록", "파랑", "남색", "보라"];
        //1번째는 빨강
        //2번째는 주황
        colors.forEach((color, id) => {
            document.write(`${id + 1}번째는 ${color} <br>`);
        })

        //3. 동물을 저장할 배열
        let animals = ["고양이", "강아지", "병아리", "햄스터", "코끼리"];
        animals.forEach((animal, id, arr) => {
            document.write(`${animal}는 전체 ${arr.length}마리 중에 ${id}번째<br>`)
        })

        //4. 객체 배열
        let peoples = [
            {name: "김철수", age:20, job:"프로그래머"},
            {name:"홍길동", age:10, job: "학생"},
            {name:"이영희", age:50, job:"디자이너"},
        ]
        //이름: 김철수, 나이:20, 직업:프로그래머
        peoples.forEach((p)=>{
            document.write(`이름: ${p.name} 나이:${p.age} 직업:${p.job} <br>`);
        })

        //5. 조건문처리
        let scores = [85, 100, 90, 50, 70];
        //데이터중 90점 이상만 찾아서 "점수는 우수"
        scores.forEach((score)=>{
            if(score>=90){
                document.write(`${score}점은 우수<br>`);
            }
        })
    </script>
</head>

<body>

</body>

</html>
