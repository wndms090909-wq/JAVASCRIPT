<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        //alert - 확인버튼만 있음, 경고창
        //prompt - 데이터를 입력받는 확인/취소 버튼이 있는 창
        //confirm = 확인/취소 버튼이 있는 창

        //설문조사를 시작하겟습니다. alert 보여주기
        //나이를 입력 prompt
        //나이가 맞는지 확인하는 창 confirm
        //입력한 나이가 20보다 크면 "설문 참여가 가능합니다."
        //20보다 적으면 "설문 참여가 불가능합니다."
        //설문을 취소했습니다
        window.alert("설문을 시작합니다");
        let userAge = window.prompt("나이를 입력하세요", "");
        let okCancle = window.confirm(`입력한 나이가 ${userAge}가 맞나요?`);
        //확인 true 취소 false값이 okCancle안에 들어감
        console.log(okCancle);
        // ! = 
        if (!okCancle) {
            userAge = window.prompt("나이를 입력하세요", "");
            okCancle = window.confirm(`입력한 나이가 ${userAge}가 맞나요?`);
        }

        if (okCancle) {
            if (userAge >= 20) {
                document.write("설문 참여 가능");
            }
            else {
                document.write("설문 참여 불가능")
            }
        }
        else {
            document.write("설문이 취소되었습니다")
        }


        //okCancle true일때만 if문 실행
        // if (okCancle && userAge >= 20) {
        //     document.write("설문 참여 가능");
        // }
        // else {
        //     document.write("설문 참여 불가능")
        // }
    </script>
</head>

</html>
