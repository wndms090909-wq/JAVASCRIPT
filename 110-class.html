<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        //차 클래스 만들기
        //속성 : 차종류(kind), 색상(color), 가격(price)
        //메서드(run): 올해 베스트 차는 색상색 차종류입니다, 가격은 얼마입니다
        
        
    
        class Car {
            constructor(kind1, color1, price1){
                this.kind = kind1;
                this.color = color1;
                this.price = price1;
            }
            run(){
                console.log(`올해 베스트 차는 ${this.color}색 ${this.kind}입니다, 가격은 ${this.price}입니다`);
            }
        }

        //스포츠카, 빨강, 1억 - sports
        let sports = new Car("sports","빨강","1억");
        sports.run();

        // suv, 검정 , 5천 - suv
        let suv = new Car("suv","검정","5천")
        suv.run();
    </script>
</head>

</body>
</html>
