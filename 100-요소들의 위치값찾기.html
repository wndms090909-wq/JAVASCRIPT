<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        header{
            background: #ccc;
            height: 100px;
        }
        main{
            position: relative;
        }
        .section1{
            position: absolute;
            background: lightpink;
            margin-top: 600px;
            
        }
    </style>
</head>
<body>
    <header>logo</header>
    <main>
        <section class="section1">section1</section>
    </main>
    <script>
        let section = document.querySelector(".section1");
        //부모를 기준으로 위치 offsetTop - 포지션일때, 아닐때는 기기랑 같음
        console.log("offsetTop:", section.offsetTop);
        //내가 보고있는 기기가 기준 getBoundingClientRect().top
        console.log("viewport:", section.getBoundingClientRect().top);

    </script>
</body>
</html>
